stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "$DOCKER_USERNAME/symfony-app"

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # Connecter Docker Hub
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # Construire l'image Docker
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    # Taguer l'image comme "latest"
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest
  only:
    - main  # Construire uniquement sur la branche principale

deploy_image:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    # Connecter Docker Hub
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # Pousser les images Docker
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:latest
  only:
    - main  # Déployer uniquement sur la branche principale
