    <div class="events-form" style="padding-top: 50px;">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <form action="ajouter-evenement.php" method="POST" class="form-group">
                        <div class="row">
                            <div class="col-lg-6">
                                <label for="eventName">Event Name</label>
                                <input type="text" id="eventName" name="eventName" class="form-control" placeholder="Enter event name" required>
                            </div>
                            <div class="col-lg-6">
                                <label for="eventDate">Event Date</label>
                                <input type="date" id="eventDate" name="eventDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <label for="eventLocation">Event Location</label>
                                <input type="text" id="eventLocation" name="eventLocation" class="form-control" placeholder="Enter event location" required>
                            </div>
                            <div class="col-lg-6">
                                <label for="ticketsAvailable">Tickets Available</label>
                                <input type="number" id="ticketsAvailable" name="ticketsAvailable" class="form-control" placeholder="Number of tickets" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <label for="ticketPrice">Ticket Price</label>
                                <input type="number" id="ticketPrice" name="ticketPrice" class="form-control" placeholder="Ticket price" required>
                            </div>
                            <div class="col-lg-6">
                                <!-- This column is now empty for alignment purpose -->
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-12">
                                <label for="eventDescription">Event Description</label>
                                <textarea id="eventDescription" name="eventDescription" class="form-control" rows="4" placeholder="Enter event description" required></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-12 text-center">
                                <div class="main-dark-button">
                                    <a href="#" class="btn main-dark-button">Add Event</a>
                                </div>
                            </div>
                        </div>
                    </form>
